name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          version: v1.29.0
      - name: Install Vite+
        run: curl -fsSL https://vite.plus | VP_VERSION=0.2.8 bash
      - name: Install dependencies
        run: ~/.vite-plus/bin/vp install
      - name: Check
        run: ~/.vite-plus/bin/vp check
      - name: Test
        run: ~/.vite-plus/bin/vp test
      - name: Build addon
        run: ~/.vite-plus/bin/vp pack
      - name: Build static Storybook
        run: ~/.vite-plus/bin/vp run storybook:build
      - name: Upload Storybook Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    name: Deploy Storybook demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # Configure Pages metadata for this repository.
      id-token: write # Authenticate the deployment through GitHub OIDC.
      pages: write # Publish the uploaded artifact to GitHub Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Storybook to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
