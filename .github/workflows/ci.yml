name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          version: v1.29.0
      - name: Install Vite+
        run: curl -fsSL https://vite.plus | VP_VERSION=0.2.8 bash
      - name: Install dependencies
        run: ~/.vite-plus/bin/vp install
      - name: Check
        run: ~/.vite-plus/bin/vp check
      - name: Test
        run: ~/.vite-plus/bin/vp test
      - name: Build addon
        run: ~/.vite-plus/bin/vp pack
      - name: Build static Storybook
        run: ~/.vite-plus/bin/vp run storybook:build
